# SonarCloud / SonarQube — align keys with your SonarCloud project; set sonar.organization for SonarCloud.
# sonar.organization=your-org
sonar.projectKey=secure-student-management-system
sonar.projectName=Secure Student Management System
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.tsx
