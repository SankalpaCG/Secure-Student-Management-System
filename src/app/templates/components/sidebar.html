<aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
        <div class="d-flex align-items-center gap-2">
            <div class="sidebar-brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <div>
                <div class="sidebar-brand-text">Secure Student MS</div>
                <div class="sidebar-brand-sub">University Portal</div>
                {% if current_user.is_authenticated %}
                <span class="sidebar-role-badge">{{ current_user.role.value }}</span>
                {% endif %}
            </div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <ul class="nav flex-column">
            {% for item in sidebar_nav %}
            <li class="nav-item">
                <a class="nav-link{% if is_nav_active(item.endpoint) %} active{% endif %}"
                   href="{{ nav_item_url(item.endpoint) }}">
                    <i class="bi bi-{{ item.icon }}"></i>
                    <span>{{ item.label }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </nav>
    <div class="sidebar-footer">
        <a class="nav-link" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-left"></i>
            <span>Logout</span>
        </a>
    </div>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
