{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container error-page">
    <div class="text-center col-lg-6 mx-auto">
        <div class="error-icon mb-3"><i class="bi bi-shield-exclamation"></i></div>
        <h1 class="display-5 fw-bold text-danger">403 — Access Denied</h1>
        <p class="lead text-muted mb-4">You do not have permission to access this resource. This attempt has been logged.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i>Home</a>
        {% if current_user.is_authenticated and is_2fa_verified %}
        <a href="{{ url_for(dashboard_endpoint) }}" class="btn btn-outline-secondary">Dashboard</a>
        {% endif %}
    </div>
</div>
{% endblock %}
