{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container error-page">
    <div class="text-center col-lg-6 mx-auto">
        <div class="error-icon mb-3"><i class="bi bi-search"></i></div>
        <h1 class="display-5 fw-bold text-danger">404 — Page Not Found</h1>
        <p class="lead text-muted mb-4">The page you requested could not be found.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i>Home</a>
        {% if current_user.is_authenticated and is_2fa_verified %}
        <a href="{{ url_for(dashboard_endpoint) }}" class="btn btn-outline-secondary">Dashboard</a>
        {% endif %}
    </div>
</div>
{% endblock %}
