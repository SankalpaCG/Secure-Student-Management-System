{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="container error-page">
    <div class="text-center col-lg-6 mx-auto">
        <div class="error-icon mb-3"><i class="bi bi-exclamation-octagon"></i></div>
        <h1 class="display-5 fw-bold text-danger">500 — Server Error</h1>
        <p class="lead text-muted mb-4">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i>Home</a>
    </div>
</div>
{% endblock %}
