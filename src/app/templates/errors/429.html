{% extends "base.html" %}
{% block title %}Too Many Requests{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center">
      <div class="display-1 text-warning fw-bold">429</div>
      <h1 class="h3 mb-3">Too Many Requests</h1>
      <p class="text-muted mb-4">
        You have exceeded the allowed number of requests for this action.
        Please wait a moment before trying again.
      </p>
      <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
