<div class="empty-state text-center py-5 px-3">
  <div class="empty-state-icon-wrap mx-auto mb-3">
    <i class="bi bi-{{ icon|default('inbox') }}"></i>
  </div>
  <h5 class="fw-semibold mb-2">{{ title|default('No records found') }}</h5>
  {% if message %}<p class="text-muted small mb-3 mx-auto" style="max-width: 28rem">{{ message }}</p>{% endif %}
  {% if action_url and action_label %}
  <a href="{{ action_url }}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg me-1"></i>{{ action_label }}</a>
  {% endif %}
</div>
