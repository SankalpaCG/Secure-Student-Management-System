{% if pagination and pagination.pages > 1 %}
<nav class="mt-3" aria-label="Table pagination">
  <ul class="pagination pagination-sm justify-content-end mb-0">
    <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
      <a class="page-link" href="{{ pagination.url(pagination.prev_num) if pagination.has_prev else '#' }}">Previous</a>
    </li>
    {% for p in pagination.iter_pages() %}
      {% if p %}
      <li class="page-item {% if p == pagination.page %}active{% endif %}">
        <a class="page-link" href="{{ pagination.url(p) }}">{{ p }}</a>
      </li>
      {% else %}
      <li class="page-item disabled"><span class="page-link">…</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
      <a class="page-link" href="{{ pagination.url(pagination.next_num) if pagination.has_next else '#' }}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
